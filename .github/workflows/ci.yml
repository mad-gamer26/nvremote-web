name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The full-session tests need a real NVDA Remote relay, so CI runs the
      # accessibility, form and mocked-gateway tests only.
      - run: npx playwright test --grep-invert "full session|braille display|generates a key"
