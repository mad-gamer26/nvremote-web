# nvremote.mad-gamer.com: NVDA Remote Web (static site from /opt/nvremote-web/public,
# WebSocket gateway nvremote-web-gateway.service on 127.0.0.1:39870).
# Source: ~/nvremote-web/deploy/nginx-nvremote.conf

map $uri $nvremote_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name nvremote.mad-gamer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nvremote.mad-gamer.com;
    include /etc/nginx/snippets/ssl-wildcard.conf;

    root /opt/nvremote-web/public;
    index index.html;
    client_max_body_size 16k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' wss://nvremote.mad-gamer.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "fullscreen=(self), clipboard-read=(self), clipboard-write=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $nvremote_cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /ws {
        # Like snippets/proxy-common.conf, but with long timeouts for long-lived sessions
        # (the gateway also pings every 30 seconds).
        proxy_pass http://127.0.0.1:39870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
